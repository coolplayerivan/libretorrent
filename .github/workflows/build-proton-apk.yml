name: Build Proton test APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build-proton-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36'
      - name: Build test APK
        run: ./gradlew :app:assembleBaseDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LibreTorrent-Proton-debug
          path: app/build/outputs/apk/base/debug/*.apk
          if-no-files-found: error
          retention-days: 7
